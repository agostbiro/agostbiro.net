[build]
  publish = "public"
  # check-links.sh fails the build on a broken internal link.
  command = "hugo --gc --minify && ./scripts/check-links.sh"

[build.environment]
  HUGO_VERSION = "0.164.0"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL && ./scripts/check-links.sh"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL && ./scripts/check-links.sh"

[[redirects]]
  from = "https://blog.agostbiro.net/*"
  to = "https://agostbiro.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/2023/06/paxos-from-first-principles/"
  to   = "/posts/2023-06-paxos-from-first-principles/"
  status = 301

[[redirects]]
  from = "/2022/04/icloud-keychain-security/"
  to   = "/posts/2022-04-icloud-keychain-security/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
