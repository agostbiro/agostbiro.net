<svg xmlns="http://www.w3.org/2000/svg" class="fig-lsb-split-row" width="760" height="174" viewBox="0 0 760 174" role="img">
  <title>Splitting the addition in the case where x and y are 1 and z and carryIn are 0: the equation for the whole word is the same as an equation for the least significant bits, landing in an intermediate carry c mid (carryMid in the lemma), followed by an equation for the remaining bits from that carry.</title>
  <style>
    /* Labels, brackets and arrows sit on the page background, so they have to
       follow the page's colour scheme. The state circles keep their own light
       fills, so the text inside them stays dark.

       Every selector is scoped to the figure's own class: this file is inlined
       into the page (layouts/_markup/render-image.html), so bare class names
       would leak into the document and collide with the other figures. */
    .fig-lsb-split-row {
      --ink: #2C2C2A;   /* labels on the page background */
      --line: #5F5E5A;  /* arrows and arrowheads */
      --rule: #6B6963;  /* span and column brackets */
      --hl: #fff2a8;    /* substituted values */
    }
    /* The appearance toggle flips body[a], which the inlined figure can read.
       Opened on its own the SVG is the root element and has no body above it,
       so svg:root falls back to the OS preference. */
    body[a="dark"] .fig-lsb-split-row {
      --ink: #D6D4CC; --line: #A8A69E; --rule: #B4B1A8; --hl: #4d4212;
    }
    @media (prefers-color-scheme: dark) {
      body[a="auto"] .fig-lsb-split-row,
      svg.fig-lsb-split-row:root {
        --ink: #D6D4CC; --line: #A8A69E; --rule: #B4B1A8; --hl: #4d4212;
      }
    }
    /* Every character of an equation is placed on a fixed grid with an x list,
       so the highlights line up whatever monospace font the reader has. The
       highlight colours are the ones code blocks use for substituted values
       (assets/css/code.scss). */
    .fig-lsb-split-row text { font-family: system-ui, sans-serif; }
    .fig-lsb-split-row .t  { font-size: 14px; font-weight: 500; }
    .fig-lsb-split-row .n  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--ink); text-anchor: middle; }
    .fig-lsb-split-row .b  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
    .fig-lsb-split-row .sub { font-size: 8px; }
    .fig-lsb-split-row .lbl { font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .fig-lsb-split-row .hl  { fill: var(--hl); }
    .fig-lsb-split-row .brk { stroke: var(--rule); stroke-width: 1; fill: none; }
    .fig-lsb-split-row .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .fig-lsb-split-row marker path { stroke: var(--line); }
  </style>
  <defs>
    <marker id="arrow-lsb-split-row" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- the whole addition, spanning all three states -->
  <rect class="hl" x="224.7" y="4" width="8.3" height="13" rx="2"/>
  <rect class="hl" x="312.9" y="4" width="8.3" height="13" rx="2"/>
  <rect class="hl" x="394.8" y="4" width="8.3" height="13" rx="2"/>
  <rect class="hl" x="426.3" y="4" width="8.3" height="13" rx="2"/>
  <text class="n" y="14"><tspan x="222.5 228.8 235.1 241.4 247.7 254 260.3 266.6 272.9 279.2 285.5 291.8 298.1 304.4 310.7 317 323.3 329.6 335.9 342.2 348.5 354.8 361.1 367.4 373.7 380 386.3 392.6 398.9 405.2 411.5 417.8 424.1 430.4 436.7 443 449.3 455.6 461.9 468.2 474.5 480.8 487.1 493.4 499.7 506 512.3 518.6 524.9 531.2 537.5">(1 + 2 * a) + (1 + 2 * b) + 0 = (0 + 2 * d) + 2 * k</tspan></text>
  <path class="brk" d="M52 30 V24 H708 V30"/>

  <!-- states -->
  <circle cx="90" cy="98" r="38" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="t" x="90" y="98" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">carry 0</text>

  <circle cx="380" cy="98" r="38" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="380" y="98" fill="#04342C" text-anchor="middle" dominant-baseline="central">carry mid</text>

  <circle cx="670" cy="98" r="38" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="t" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central"><tspan x="670" y="89">carry out</tspan><tspan x="670" y="107">term k</tspan></text>

  <!-- the first column: x, y and z -->
  <line x1="132" y1="98" x2="340" y2="98" class="arr" marker-end="url(#arrow-lsb-split-row)"/>
  <path class="brk" d="M231 50 H228 V84 H231"/>
  <path class="brk" d="M241 50 H244 V84 H241"/>
  <text class="b"><tspan x="236" y="55">1</tspan><tspan x="236" y="67">1</tspan><tspan x="236" y="79">0</tspan></text>
  <text class="lbl" x="236" y="118">least significant bits</text>

  <!-- the rest of the word: a, b and d -->
  <line x1="422" y1="98" x2="628" y2="98" class="arr" marker-end="url(#arrow-lsb-split-row)"/>
  <path class="brk" d="M520 50 H517 V84 H520"/>
  <path class="brk" d="M530 50 H533 V84 H530"/>
  <text class="b"><tspan x="525" y="55">a</tspan><tspan x="525" y="67">b</tspan><tspan x="525" y="79">d</tspan></text>
  <text class="lbl" x="525" y="118">values of the remaining bits</text>

  <!-- the two pieces -->
  <path class="brk" d="M132 142 V148 H340 V142"/>
  <rect class="hl" x="161.7" y="156" width="58.7" height="13" rx="2"/>
  <rect class="hl" x="237.3" y="156" width="8.3" height="13" rx="2"/>
  <text class="n" y="166"><tspan x="165.8 172.1 178.4 184.7 191 197.3 203.6 209.9 216.2 222.5 228.8 235.1 241.4 247.7 254 260.3 266.6 272.9 279.2 285.5 291.8">1 + 1 + 0 = 0 + 2 * c</tspan><tspan class="sub" dy="2" x="297.4 302.2 307">mid</tspan></text>

  <path class="brk" d="M422 142 V148 H628 V142"/>
  <text class="n" y="166"><tspan x="467.4 473.7 480 486.3 492.6 498.9 505.2 511.5 517.8">a + b + c</tspan><tspan class="sub" dy="2" x="523.4 528.1 532.9">mid</tspan><tspan dy="-2" x="538.5 544.8 551.1 557.4 563.7 570 576.3 582.6"> = d + k</tspan></text>
</svg>
