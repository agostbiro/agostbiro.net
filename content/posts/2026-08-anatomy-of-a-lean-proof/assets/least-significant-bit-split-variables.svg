<svg xmlns="http://www.w3.org/2000/svg" class="fig-lsb-split-vars" width="760" height="174" viewBox="0 0 760 174" role="img">
  <title>The equations of least_significant_bit_split laid out as a run: x, y and z are the least significant bits of the three rows, a, b and d are the values of their remaining bits, c in is the carry into the first column (carryIn in the lemma), c mid is the carry between the first column and the rest (carryMid in the lemma), and k is the carry out term. The equation for the whole word is the same as an equation for the least significant bits, landing in an intermediate carry, followed by an equation for the remaining bits from that carry.</title>
  <style>
    /* Labels, brackets and arrows sit on the page background, so they have to
       follow the page's colour scheme. The state circles keep their own light
       fills, so the text inside them stays dark.

       Every selector is scoped to the figure's own class: this file is inlined
       into the page (layouts/_markup/render-image.html), so bare class names
       would leak into the document and collide with the other figures. */
    .fig-lsb-split-vars {
      --ink: #2C2C2A;   /* labels on the page background */
      --line: #5F5E5A;  /* arrows and arrowheads */
      --rule: #6B6963;  /* span and column brackets */
    }
    /* The appearance toggle flips body[a], which the inlined figure can read.
       Opened on its own the SVG is the root element and has no body above it,
       so svg:root falls back to the OS preference. */
    body[a="dark"] .fig-lsb-split-vars {
      --ink: #D6D4CC; --line: #A8A69E; --rule: #B4B1A8;
    }
    @media (prefers-color-scheme: dark) {
      body[a="auto"] .fig-lsb-split-vars,
      svg.fig-lsb-split-vars:root {
        --ink: #D6D4CC; --line: #A8A69E; --rule: #B4B1A8;
      }
    }
    /* Every character of an equation is placed on a fixed grid with an x list,
       so the equations look the same whatever monospace font the reader has. */
    .fig-lsb-split-vars text { font-family: system-ui, sans-serif; }
    .fig-lsb-split-vars .t  { font-size: 14px; font-weight: 500; }
    .fig-lsb-split-vars .n  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--ink); text-anchor: middle; }
    .fig-lsb-split-vars .b  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
    .fig-lsb-split-vars .sub { font-size: 8px; }
    .fig-lsb-split-vars .lbl { font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .fig-lsb-split-vars .brk { stroke: var(--rule); stroke-width: 1; fill: none; }
    .fig-lsb-split-vars .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .fig-lsb-split-vars marker path { stroke: var(--line); }
  </style>
  <defs>
    <marker id="arrow-lsb-split-vars" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- the whole addition, spanning all three states -->
  <text class="n" y="14"><tspan x="217.7 224 230.3 236.6 242.9 249.2 255.5 261.8 268.1 274.4 280.7 287 293.3 299.6 305.9 312.2 318.5 324.8 331.1 337.4 343.7 350 356.3 362.6 368.9 375.2 381.5 387.8 394.1">(x + 2 * a) + (y + 2 * b) + c</tspan><tspan class="sub" dy="2" x="399.7 404.5">in</tspan><tspan dy="-2" x="410 416.3 422.6 428.9 435.2 441.5 447.8 454.1 460.4 466.7 473 479.3 485.6 491.9 498.2 504.5 510.8 517.1 523.4 529.7 536 542.3"> = (z + 2 * d) + 2 * k</tspan></text>
  <path class="brk" d="M52 30 V24 H708 V30"/>

  <!-- states -->
  <circle cx="90" cy="98" r="38" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="t" x="90" y="98" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">carry in</text>

  <circle cx="380" cy="98" r="38" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="t" x="380" y="98" fill="#0C447C" text-anchor="middle" dominant-baseline="central">carry mid</text>

  <circle cx="670" cy="98" r="38" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="t" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central"><tspan x="670" y="89">carry out</tspan><tspan x="670" y="107">term k</tspan></text>

  <!-- the first column: x, y and z -->
  <line x1="132" y1="98" x2="340" y2="98" class="arr" marker-end="url(#arrow-lsb-split-vars)"/>
  <path class="brk" d="M231 50 H228 V84 H231"/>
  <path class="brk" d="M241 50 H244 V84 H241"/>
  <text class="b"><tspan x="236" y="55">x</tspan><tspan x="236" y="67">y</tspan><tspan x="236" y="79">z</tspan></text>
  <text class="lbl" x="236" y="118">least significant bits</text>

  <!-- the rest of the word: a, b and d -->
  <line x1="422" y1="98" x2="628" y2="98" class="arr" marker-end="url(#arrow-lsb-split-vars)"/>
  <path class="brk" d="M520 50 H517 V84 H520"/>
  <path class="brk" d="M530 50 H533 V84 H530"/>
  <text class="b"><tspan x="525" y="55">a</tspan><tspan x="525" y="67">b</tspan><tspan x="525" y="79">d</tspan></text>
  <text class="lbl" x="525" y="118">sums of the remaining bits</text>

  <!-- the two pieces -->
  <path class="brk" d="M132 142 V148 H340 V142"/>
  <text class="n" y="166"><tspan x="161 167.3 173.6 179.9 186.2 192.5 198.8 205.1 211.4">x + y + c</tspan><tspan class="sub" dy="2" x="217 221.8">in</tspan><tspan dy="-2" x="227.3 233.6 239.9 246.2 252.5 258.8 265.1 271.4 277.7 284 290.3 296.6"> = z + 2 * c</tspan><tspan class="sub" dy="2" x="302.2 307 311.8">mid</tspan></text>

  <path class="brk" d="M422 142 V148 H628 V142"/>
  <text class="n" y="166"><tspan x="467.4 473.7 480 486.3 492.6 498.9 505.2 511.5 517.8">a + b + c</tspan><tspan class="sub" dy="2" x="523.4 528.1 532.9">mid</tspan><tspan dy="-2" x="538.5 544.8 551.1 557.4 563.7 570 576.3 582.6"> = d + k</tspan></text>
</svg>
