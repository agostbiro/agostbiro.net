<svg xmlns="http://www.w3.org/2000/svg" class="fig-int-lit" width="680" height="336" viewBox="0 0 680 336" role="img">
  <title>DFA for a decimal integer literal, including the dead state</title>
  <style>
    /* Labels and arrows sit on the page background, so they have to follow the
       page's colour scheme. The state circles keep their own light fills.

       Every selector is scoped to the figure's own class: this file is inlined
       into the page (layouts/_markup/render-image.html), so bare class names
       would leak into the document and collide with the other figures. */
    .fig-int-lit {
      --ink: #2C2C2A;   /* labels on the page background */
      --line: #5F5E5A;  /* arrows and arrowheads */
    }
    /* The appearance toggle flips body[a], which the inlined figure can read.
       Opened on its own the SVG is the root element and has no body above it,
       so svg:root falls back to the OS preference. */
    body[a="dark"] .fig-int-lit { --ink: #D6D4CC; --line: #A8A69E; }
    @media (prefers-color-scheme: dark) {
      body[a="auto"] .fig-int-lit,
      svg.fig-int-lit:root { --ink: #D6D4CC; --line: #A8A69E; }
    }
    .fig-int-lit text { font-family: system-ui, sans-serif; }
    .fig-int-lit .t  { font-size: 14px; font-weight: 500; }
    .fig-int-lit .ts { font-size: 12px; fill: var(--ink); }
    .fig-int-lit .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .fig-int-lit marker path { stroke: var(--line); }
  </style>
  <defs>
    <marker id="arrow-int-lit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <circle cx="150" cy="110" r="32" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="t" x="150" y="110" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">start</text>
  <circle cx="340" cy="110" r="32" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="t" x="340" y="110" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">sign</text>
  <circle cx="530" cy="110" r="36" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <circle cx="530" cy="110" r="30" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="530" y="110" fill="#04342C" text-anchor="middle" dominant-baseline="central">digits</text>
  <circle cx="340" cy="258" r="34" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="t" x="340" y="258" fill="#501313" text-anchor="middle" dominant-baseline="central">dead</text>

  <line x1="182" y1="110" x2="298" y2="110" class="arr" marker-end="url(#arrow-int-lit)"/>
  <text class="ts" x="240" y="98" text-anchor="middle">-</text>
  <line x1="372" y1="110" x2="486" y2="110" class="arr" marker-end="url(#arrow-int-lit)"/>
  <text class="ts" x="429" y="98" text-anchor="middle">0-9</text>

  <path d="M174 83 Q 340 10 508 85" class="arr" marker-end="url(#arrow-int-lit)"/>
  <text class="ts" x="340" y="32" text-anchor="middle">0-9</text>
  <path d="M560 92 C 600 78 600 142 560 128" class="arr" marker-end="url(#arrow-int-lit)"/>
  <text class="ts" x="606" y="110" dominant-baseline="central">0-9</text>

  <line x1="175" y1="130" x2="310" y2="236" class="arr" marker-end="url(#arrow-int-lit)"/>
  <text class="ts" x="200" y="192" text-anchor="end">other</text>
  <line x1="340" y1="142" x2="340" y2="220" class="arr" marker-end="url(#arrow-int-lit)"/>
  <text class="ts" x="352" y="186">other</text>
  <line x1="505" y1="130" x2="370" y2="236" class="arr" marker-end="url(#arrow-int-lit)"/>
  <text class="ts" x="448" y="192">other</text>

  <path d="M308 238 C 266 222 266 294 308 278" class="arr" marker-end="url(#arrow-int-lit)"/>
  <text class="ts" x="258" y="258" text-anchor="end" dominant-baseline="central">any</text>
</svg>
