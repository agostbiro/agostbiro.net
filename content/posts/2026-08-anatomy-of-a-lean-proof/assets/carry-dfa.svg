<svg xmlns="http://www.w3.org/2000/svg" class="fig-carry-dfa" width="740" height="420" viewBox="0 0 740 420" role="img">
  <title>DFA recognizing B reversed: a full adder whose state is the pending carry, plus a dead state. Each transition is labelled with the three-bit column symbols that take it: solid arrows are the columns whose sum bit checks out, dashed red arrows the columns whose sum bit does not match.</title>
  <style>
    /* Labels and arrows sit on the page background, so they have to follow the
       page's colour scheme. The state circles keep their own light fills, so
       the text inside them stays dark.

       Every selector is scoped to the figure's own class: this file is inlined
       into the page (layouts/_markup/render-image.html), so bare class names
       would leak into the document and collide with the other figures. */
    .fig-carry-dfa {
      --ink: #2C2C2A;   /* labels on the page background */
      --line: #5F5E5A;  /* arrows and arrowheads */
      --rule: #6B6963;  /* column brackets */
      --bad: #8C2020;   /* the transitions whose check fails */
    }
    /* The appearance toggle flips body[a], which the inlined figure can read.
       Opened on its own the SVG is the root element and has no body above it,
       so svg:root falls back to the OS preference. */
    body[a="dark"] .fig-carry-dfa {
      --ink: #D6D4CC; --line: #A8A69E; --rule: #B4B1A8; --bad: #E39191;
    }
    @media (prefers-color-scheme: dark) {
      body[a="auto"] .fig-carry-dfa,
      svg.fig-carry-dfa:root {
        --ink: #D6D4CC; --line: #A8A69E; --rule: #B4B1A8; --bad: #E39191;
      }
    }
    .fig-carry-dfa text { font-family: system-ui, sans-serif; }
    .fig-carry-dfa .t  { font-size: 14px; font-weight: 500; }
    .fig-carry-dfa .ts { font-size: 12px; fill: var(--ink); }
    .fig-carry-dfa .key { font-size: 11px; fill: var(--ink); }
    .fig-carry-dfa .b  { font-size: 11px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
    .fig-carry-dfa .cm { font-size: 12px; fill: var(--ink); text-anchor: middle; }
    .fig-carry-dfa .brk { stroke: var(--rule); stroke-width: 1; fill: none; }
    .fig-carry-dfa .sub { font-size: 8px; }
    .fig-carry-dfa .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
    /* The check fails: dashed and in the same red the reject run figure uses. */
    .fig-carry-dfa .arr-bad { stroke: var(--bad); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    /* The sink loop is solid, since it takes every column, but it stays in the
       dead state's red. */
    .fig-carry-dfa .arr-any { stroke: var(--bad); stroke-width: 1.5; fill: none; }
    .fig-carry-dfa marker path { stroke: var(--line); }
    .fig-carry-dfa marker#arrow-carry-dfa-bad path { stroke: var(--bad); }
  </style>
  <defs>
    <marker id="arrow-carry-dfa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-carry-dfa-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8C2020" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <circle cx="230" cy="175" r="38" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <circle cx="230" cy="175" r="32" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="230" y="175" fill="#04342C" text-anchor="middle" dominant-baseline="central">carry 0</text>

  <circle cx="510" cy="175" r="34" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="t" x="510" y="175" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">carry 1</text>

  <circle cx="370" cy="350" r="34" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="t" x="370" y="350" fill="#501313" text-anchor="middle" dominant-baseline="central">dead</text>

  <line x1="166" y1="239" x2="203" y2="202" class="arr" marker-end="url(#arrow-carry-dfa)"/>
  <text class="ts" x="159" y="245" text-anchor="end">start</text>

  <!-- the sum bit checks out -->
  <path d="M192 157 C 152 143 152 207 192 193" class="arr" marker-end="url(#arrow-carry-dfa)"/>

  <path d="M544 157 C 584 143 584 207 544 193" class="arr" marker-end="url(#arrow-carry-dfa)"/>

  <path d="M252 144 Q 371 46 490 147" class="arr" marker-end="url(#arrow-carry-dfa)"/>

  <path d="M482 155 Q 371 130 261 153" class="arr" marker-end="url(#arrow-carry-dfa)"/>

  <!-- the sum bit does not match -->
  <line x1="254" y1="205" x2="349" y2="323" class="arr-bad" marker-end="url(#arrow-carry-dfa-bad)"/>
  <line x1="489" y1="202" x2="391" y2="323" class="arr-bad" marker-end="url(#arrow-carry-dfa-bad)"/>

  <path d="M404 332 C 444 318 444 382 404 368" class="arr-any" marker-end="url(#arrow-carry-dfa-bad)"/>
  <text class="ts" x="452" y="350" dominant-baseline="central">any column</text>

  <!-- legend -->
  <line x1="30" y1="342" x2="70" y2="342" class="arr" marker-end="url(#arrow-carry-dfa)"/>
  <text class="key" x="80" y="342" dominant-baseline="central">x &#8853; y &#8853; c<tspan class="sub" dy="2">in</tspan><tspan dy="-2"> = z &#10003;</tspan></text>
  <line x1="30" y1="372" x2="70" y2="372" class="arr-bad" marker-end="url(#arrow-carry-dfa-bad)"/>
  <text class="key" x="80" y="372" dominant-baseline="central">x &#8853; y &#8853; c<tspan class="sub" dy="2">in</tspan><tspan dy="-2"> &#8800; z &#10007;</tspan></text>
