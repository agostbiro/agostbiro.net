<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420" role="img">
  <title>DFA recognizing B reversed: a full adder whose state is the pending carry, plus a dead state. Transitions are labelled with the three-bit column symbols of the alphabet.</title>
  <style>
    text { font-family: system-ui, sans-serif; }
    .t  { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #444441; }
    .b  { font-size: 11px; fill: #444441; text-anchor: middle; dominant-baseline: central; }
    .cm { font-size: 12px; fill: #444441; text-anchor: middle; }
    .brk { stroke: #8A8880; stroke-width: 1; fill: none; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    /* Labels, brackets and arrows sit on the page background, so they have to
       follow the page's colour scheme. The state circles keep their own light
       fills, so the text inside them stays dark. */
    @media (prefers-color-scheme: dark) {
      .ts, .b, .cm { fill: #D6D4CC; }
      .brk { stroke: #B4B1A8; }
      .arr { stroke: #A8A69E; }
      marker path { stroke: #A8A69E; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <circle cx="230" cy="175" r="38" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <circle cx="230" cy="175" r="32" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="230" y="175" fill="#04342C" text-anchor="middle" dominant-baseline="central">carry 0</text>

  <circle cx="510" cy="175" r="34" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="t" x="510" y="175" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">carry 1</text>

  <circle cx="370" cy="350" r="34" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="t" x="370" y="350" fill="#501313" text-anchor="middle" dominant-baseline="central">dead</text>

  <line x1="166" y1="239" x2="203" y2="202" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="159" y="245" text-anchor="end">start</text>

  <path d="M192 157 C 152 143 152 207 192 193" class="arr" marker-end="url(#arrow)"/>
  <path d="M544 157 C 584 143 584 207 544 193" class="arr" marker-end="url(#arrow)"/>
  <path d="M252 144 Q 371 46 490 147" class="arr" marker-end="url(#arrow)"/>
  <path d="M482 155 Q 371 130 261 153" class="arr" marker-end="url(#arrow)"/>
  <line x1="254" y1="205" x2="349" y2="323" class="arr" marker-end="url(#arrow)"/>
  <line x1="489" y1="202" x2="391" y2="323" class="arr" marker-end="url(#arrow)"/>
  <path d="M336 332 C 296 318 296 382 336 368" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="288" y="350" text-anchor="end" dominant-baseline="central">any column</text>

  <!-- c0 self -->
    <path class="brk" d="M75.0 158 H72.0 V192 H75.0"/>
    <path class="brk" d="M85.0 158 H88.0 V192 H85.0"/>
    <text class="b"><tspan x="80.0" y="163">0</tspan><tspan x="80.0" y="175">0</tspan><tspan x="80.0" y="187">0</tspan></text>
    <text class="cm" x="94.0" y="180">,</text>
    <path class="brk" d="M103.0 158 H100.0 V192 H103.0"/>
    <path class="brk" d="M113.0 158 H116.0 V192 H113.0"/>
    <text class="b"><tspan x="108.0" y="163">0</tspan><tspan x="108.0" y="175">1</tspan><tspan x="108.0" y="187">1</tspan></text>
    <text class="cm" x="122.0" y="180">,</text>
    <path class="brk" d="M131.0 158 H128.0 V192 H131.0"/>
    <path class="brk" d="M141.0 158 H144.0 V192 H141.0"/>
    <text class="b"><tspan x="136.0" y="163">1</tspan><tspan x="136.0" y="175">0</tspan><tspan x="136.0" y="187">1</tspan></text>
  <!-- c1 self -->
    <path class="brk" d="M595.0 158 H592.0 V192 H595.0"/>
    <path class="brk" d="M605.0 158 H608.0 V192 H605.0"/>
    <text class="b"><tspan x="600.0" y="163">0</tspan><tspan x="600.0" y="175">1</tspan><tspan x="600.0" y="187">0</tspan></text>
    <text class="cm" x="614.0" y="180">,</text>
    <path class="brk" d="M623.0 158 H620.0 V192 H623.0"/>
    <path class="brk" d="M633.0 158 H636.0 V192 H633.0"/>
    <text class="b"><tspan x="628.0" y="163">1</tspan><tspan x="628.0" y="175">0</tspan><tspan x="628.0" y="187">0</tspan></text>
    <text class="cm" x="642.0" y="180">,</text>
    <path class="brk" d="M651.0 158 H648.0 V192 H651.0"/>
    <path class="brk" d="M661.0 158 H664.0 V192 H661.0"/>
    <text class="b"><tspan x="656.0" y="163">1</tspan><tspan x="656.0" y="175">1</tspan><tspan x="656.0" y="187">1</tspan></text>
  <!-- c0->c1 -->
    <path class="brk" d="M366.0 53 H363.0 V87 H366.0"/>
    <path class="brk" d="M376.0 53 H379.0 V87 H376.0"/>
    <text class="b"><tspan x="371.0" y="58">1</tspan><tspan x="371.0" y="70">1</tspan><tspan x="371.0" y="82">0</tspan></text>
  <!-- c1->c0 -->
    <path class="brk" d="M366.0 151 H363.0 V185 H366.0"/>
    <path class="brk" d="M376.0 151 H379.0 V185 H376.0"/>
    <text class="b"><tspan x="371.0" y="156">0</tspan><tspan x="371.0" y="168">0</tspan><tspan x="371.0" y="180">1</tspan></text>
  <!-- c0->dead -->
    <path class="brk" d="M182.0 268 H179.0 V302 H182.0"/>
    <path class="brk" d="M192.0 268 H195.0 V302 H192.0"/>
    <text class="b"><tspan x="187.0" y="273">0</tspan><tspan x="187.0" y="285">0</tspan><tspan x="187.0" y="297">1</tspan></text>
    <text class="cm" x="201.0" y="290">,</text>
    <path class="brk" d="M210.0 268 H207.0 V302 H210.0"/>
    <path class="brk" d="M220.0 268 H223.0 V302 H220.0"/>
    <text class="b"><tspan x="215.0" y="273">0</tspan><tspan x="215.0" y="285">1</tspan><tspan x="215.0" y="297">0</tspan></text>
    <text class="cm" x="229.0" y="290">,</text>
    <path class="brk" d="M238.0 268 H235.0 V302 H238.0"/>
    <path class="brk" d="M248.0 268 H251.0 V302 H248.0"/>
    <text class="b"><tspan x="243.0" y="273">1</tspan><tspan x="243.0" y="285">0</tspan><tspan x="243.0" y="297">0</tspan></text>
    <text class="cm" x="257.0" y="290">,</text>
    <path class="brk" d="M266.0 268 H263.0 V302 H266.0"/>
    <path class="brk" d="M276.0 268 H279.0 V302 H276.0"/>
    <text class="b"><tspan x="271.0" y="273">1</tspan><tspan x="271.0" y="285">1</tspan><tspan x="271.0" y="297">1</tspan></text>
  <!-- c1->dead -->
    <path class="brk" d="M464.0 268 H461.0 V302 H464.0"/>
    <path class="brk" d="M474.0 268 H477.0 V302 H474.0"/>
    <text class="b"><tspan x="469.0" y="273">0</tspan><tspan x="469.0" y="285">0</tspan><tspan x="469.0" y="297">0</tspan></text>
    <text class="cm" x="483.0" y="290">,</text>
    <path class="brk" d="M492.0 268 H489.0 V302 H492.0"/>
    <path class="brk" d="M502.0 268 H505.0 V302 H502.0"/>
    <text class="b"><tspan x="497.0" y="273">0</tspan><tspan x="497.0" y="285">1</tspan><tspan x="497.0" y="297">1</tspan></text>
    <text class="cm" x="511.0" y="290">,</text>
    <path class="brk" d="M520.0 268 H517.0 V302 H520.0"/>
    <path class="brk" d="M530.0 268 H533.0 V302 H530.0"/>
    <text class="b"><tspan x="525.0" y="273">1</tspan><tspan x="525.0" y="285">0</tspan><tspan x="525.0" y="297">1</tspan></text>
    <text class="cm" x="539.0" y="290">,</text>
    <path class="brk" d="M548.0 268 H545.0 V302 H548.0"/>
    <path class="brk" d="M558.0 268 H561.0 V302 H558.0"/>
    <text class="b"><tspan x="553.0" y="273">1</tspan><tspan x="553.0" y="285">1</tspan><tspan x="553.0" y="297">0</tspan></text>
</svg>
