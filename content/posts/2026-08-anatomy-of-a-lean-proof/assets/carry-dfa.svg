    <text class="cm" x="642.0" y="180">,</text>
    <path class="brk" d="M651.0 158 H648.0 V192 H651.0"/>
    <path class="brk" d="M661.0 158 H664.0 V192 H661.0"/>
    <text class="b"><tspan x="656.0" y="163">1</tspan><tspan x="656.0" y="175">1</tspan><tspan x="656.0" y="187">1</tspan></text>
  <!-- c0->c1 -->
    <path class="brk" d="M366.0 53 H363.0 V87 H366.0"/>
    <path class="brk" d="M376.0 53 H379.0 V87 H376.0"/>
    <text class="b"><tspan x="371.0" y="58">1</tspan><tspan x="371.0" y="70">1</tspan><tspan x="371.0" y="82">0</tspan></text>
  <!-- c1->c0 -->
    <path class="brk" d="M366.0 151 H363.0 V185 H366.0"/>
