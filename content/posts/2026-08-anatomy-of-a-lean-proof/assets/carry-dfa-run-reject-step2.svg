<svg xmlns="http://www.w3.org/2000/svg" class="fig-run-reject-step2" width="420" height="110" viewBox="0 0 420 110" role="img">
  <title>Second step of the run of the carry automaton on the rejected word: from carry 0 the column (0,0,1) fails the sum bit check and sends the machine to the dead sink state.</title>
  <style>
    /* Labels, brackets and arrows sit on the page background, so they have to
       follow the page's colour scheme. The state circles keep their own light
       fills, so the text inside them stays dark.

       Every selector is scoped to the figure's own class: this file is inlined
       into the page (layouts/_markup/render-image.html), so bare class names
       would leak into the document and collide with the other figures. */
    .fig-run-reject-step2 {
      --ink: #2C2C2A;   /* labels on the page background */
      --line: #5F5E5A;  /* arrows and arrowheads */
      --rule: #6B6963;  /* column brackets */
      --bad: #8C2020;   /* the check that fails */
    }
    /* The appearance toggle flips body[a], which the inlined figure can read.
       Opened on its own the SVG is the root element and has no body above it,
       so svg:root falls back to the OS preference. */
    body[a="dark"] .fig-run-reject-step2 {
      --ink: #D6D4CC; --line: #A8A69E; --rule: #B4B1A8; --bad: #E39191;
    }
    @media (prefers-color-scheme: dark) {
      body[a="auto"] .fig-run-reject-step2,
      svg.fig-run-reject-step2:root {
        --ink: #D6D4CC; --line: #A8A69E; --rule: #B4B1A8; --bad: #E39191;
      }
    }
    .fig-run-reject-step2 text { font-family: system-ui, sans-serif; }
    .fig-run-reject-step2 .t  { font-size: 14px; font-weight: 500; }
    .fig-run-reject-step2 .b  { font-size: 11px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
    .fig-run-reject-step2 .chk { font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .fig-run-reject-step2 .bad { font-size: 11px; fill: var(--bad); text-anchor: middle; }
    .fig-run-reject-step2 .brk { stroke: var(--rule); stroke-width: 1; fill: none; }
    .fig-run-reject-step2 .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .fig-run-reject-step2 marker path { stroke: var(--line); }
  </style>
  <defs>
    <marker id="arrow-run-reject-step2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- states -->
  <circle cx="60" cy="60" r="38" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <circle cx="60" cy="60" r="32" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="60" y="60" fill="#04342C" text-anchor="middle" dominant-baseline="central">carry 0</text>

  <circle cx="332" cy="60" r="34" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="t" x="332" y="60" fill="#501313" text-anchor="middle" dominant-baseline="central">dead</text>

  <!-- step -->
  <line x1="102" y1="60" x2="296" y2="60" class="arr" marker-end="url(#arrow-run-reject-step2)"/>
  <path class="brk" d="M193 12 H190 V46 H193"/>
  <path class="brk" d="M203 12 H206 V46 H203"/>
  <text class="b"><tspan x="198" y="17">0</tspan><tspan x="198" y="29">0</tspan><tspan x="198" y="41">1</tspan></text>
  <text class="bad" x="198" y="82">0 &#8853; 0 &#8853; 0 = 0 &#8800; 1 &#10007;</text>
  <text class="chk" x="198" y="98">sum bit does not match</text>
</svg>
