<svg xmlns="http://www.w3.org/2000/svg" class="fig-run-reject" width="760" height="110" viewBox="0 0 760 110" role="img">
  <title>The run of the carry automaton on the rejected word, unrolled: from carry 0 the column (1,0,1) keeps the machine in carry 0, then the column (0,0,1) fails the sum bit check and sends it to the dead sink state.</title>
  <style>
    /* Labels, brackets and arrows sit on the page background, so they have to
       follow the page's colour scheme. The state circles keep their own light
       fills, so the text inside them stays dark.

       Every selector is scoped to the figure's own class: this file is inlined
       into the page (layouts/_markup/render-image.html), so bare class names
       would leak into the document and collide with the other figures. */
    .fig-run-reject {
      --ink: #2C2C2A;   /* labels on the page background */
      --line: #5F5E5A;  /* arrows and arrowheads */
      --rule: #6B6963;  /* column brackets */
      --bad: #8C2020;   /* the check that fails */
    }
    /* The appearance toggle flips body[a], which the inlined figure can read.
       Opened on its own the SVG is the root element and has no body above it,
       so svg:root falls back to the OS preference. */
    body[a="dark"] .fig-run-reject {
      --ink: #D6D4CC; --line: #A8A69E; --rule: #B4B1A8; --bad: #E39191;
    }
    @media (prefers-color-scheme: dark) {
      body[a="auto"] .fig-run-reject,
      svg.fig-run-reject:root {
        --ink: #D6D4CC; --line: #A8A69E; --rule: #B4B1A8; --bad: #E39191;
      }
    }
    .fig-run-reject text { font-family: system-ui, sans-serif; }
    .fig-run-reject .t  { font-size: 14px; font-weight: 500; }
    .fig-run-reject .ts { font-size: 12px; fill: var(--ink); }
    .fig-run-reject .b  { font-size: 11px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
    .fig-run-reject .chk { font-size: 11px; fill: var(--ink); text-anchor: middle; }
    .fig-run-reject .bad { font-size: 11px; fill: var(--bad); text-anchor: middle; }
    .fig-run-reject .brk { stroke: var(--rule); stroke-width: 1; fill: none; }
    .fig-run-reject .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .fig-run-reject marker path { stroke: var(--line); }
  </style>
  <defs>
    <marker id="arrow-run-reject" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- states -->
  <circle cx="126" cy="60" r="38" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <circle cx="126" cy="60" r="32" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="126" y="60" fill="#04342C" text-anchor="middle" dominant-baseline="central">carry 0</text>

  <circle cx="402" cy="60" r="38" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <circle cx="402" cy="60" r="32" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="402" y="60" fill="#04342C" text-anchor="middle" dominant-baseline="central">carry 0</text>

  <circle cx="674" cy="60" r="34" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="t" x="674" y="60" fill="#501313" text-anchor="middle" dominant-baseline="central">dead</text>

  <!-- start -->
  <line x1="40" y1="60" x2="86" y2="60" class="arr" marker-end="url(#arrow-run-reject)"/>
  <text class="ts" x="32" y="60" text-anchor="end" dominant-baseline="central">start</text>

  <!-- step 1 -->
  <line x1="168" y1="60" x2="362" y2="60" class="arr" marker-end="url(#arrow-run-reject)"/>
  <path class="brk" d="M259 12 H256 V46 H259"/>
  <path class="brk" d="M269 12 H272 V46 H269"/>
  <text class="b"><tspan x="264" y="17">1</tspan><tspan x="264" y="29">0</tspan><tspan x="264" y="41">1</tspan></text>
  <text class="chk" x="264" y="82">1 &#8853; 0 &#8853; 0 = 1 &#10003;</text>
  <text class="chk" x="264" y="98">carry = 0</text>

  <!-- step 2 -->
  <line x1="444" y1="60" x2="638" y2="60" class="arr" marker-end="url(#arrow-run-reject)"/>
  <path class="brk" d="M535 12 H532 V46 H535"/>
  <path class="brk" d="M545 12 H548 V46 H545"/>
  <text class="b"><tspan x="540" y="17">0</tspan><tspan x="540" y="29">0</tspan><tspan x="540" y="41">1</tspan></text>
  <text class="bad" x="540" y="82">0 &#8853; 0 &#8853; 0 = 0 &#8800; 1 &#10007;</text>
  <text class="chk" x="540" y="98">sum bit does not match</text>
</svg>
