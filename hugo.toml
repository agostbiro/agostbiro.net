baseURL = 'https://agostbiro.net/'
locale = 'en-us'
title = "Agost's Site"

[module]
  [module.hugoVersion]
    extended = true
    min      = "0.41.0"

  # Imported explicitly instead of via the `theme` key so the mounts can leave
  # out the theme's content/ directory. It ships 11 demo posts that are all
  # draft: true, which Hugo would otherwise merge into the site and list
  # whenever the server runs with -D.
  [[module.imports]]
    path = "nostyleplease"
    [[module.imports.mounts]]
      source = "assets"
      target = "assets"
    [[module.imports.mounts]]
      source = "data"
      target = "data"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true

  [markup.highlight]
    anchorLineNos      = false
    codeFences         = true
    guessSyntax        = false
    hl_Lines           = ''
    hl_inline          = false
    lineAnchors        = ''
    lineNoStart        = 1
    lineNos            = false
    lineNumbersInTable = true
    noClasses          = true
    noHl               = false
    style              = 'rrt'
    tabWidth           = 4

  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[params]
  author = "Agost Biro"
  description = ""

  [params.theme_config]
    appearance        = "auto"
    back_home_text    = ".."
    date_format       = "2006-01-02"
    isListGroupByDate = false
    isShowFooter      = true
    show_description  = true

[outputs]
  home = ["HTML", "RSS"]
